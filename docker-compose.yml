version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      # Development settings
      - DEBUG=True
      - SECRET_KEY=kiu-journeys-dev-secret-key-2024-very-secure-random-string
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,*
      - DJANGO_SETTINGS_MODULE=kiu_journeys_search.settings
      
      # Journey Service Configuration
      - FLIGHT_API_URL=https://mock.apidog.com/m1/814105-793312-default/flight-events
      - FLIGHT_API_TIMEOUT=30
      
      # Cache Configuration
      - REDIS_URL=redis://redis:6379/0
      - CACHE_TTL=3600  # 1 hour cache TTL
      
    depends_on:
      - redis
    command: python manage.py runserver 0.0.0.0:8000

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:
